<!-- This gonna be used later to get errors and tell the user -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Kryus - Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lexend', sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        overflow: hidden;
        color: #ffffff;
      }
      .card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 2.5rem 3rem;
        border-radius: 1rem;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        max-width: 640px;
        width: 90%;
        text-align: left;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        margin-top: 0;
        margin-bottom: 1rem;
        color: #ffffff;
      }
      pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        font-family: monospace;
        font-size: 0.85rem;
        color: #f87171;
        border: 1px solid rgba(248, 113, 113, 0.2);
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        An error has occurred loading this page.
      </h2>
      <!-- Using Apps Script scriptlets to safely inject the error -->
      <pre><?= errorMessage ?></pre>
    </div>
  </body>
</html>
