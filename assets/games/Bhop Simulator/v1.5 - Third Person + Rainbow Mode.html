<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhop Simulator - v1.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .slight-outline {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
    </style>
</head>
<body>

    <!-- Watermark in Bottom Left with z-index 99999 -->
    <div class="absolute bottom-4 left-6 text-white/70 font-mono text-sm tracking-wider pointer-events-none slight-outline z-[99999]">
        Made by Kryus
    </div>

    <div id="crosshair" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center">
        <svg id="crosshair-svg" class="w-6 h-6 overflow-visible" viewBox="0 0 24 24" fill="none">
            <path d="M12 3V10M12 14V21M3 12H10M14 12H21" stroke="black" stroke-width="4" stroke-linecap="square"/>
            <path id="crosshair-path" d="M12 3V10M12 14V21M3 12H10M14 12H21" stroke="white" stroke-width="2" stroke-linecap="square"/>
        </svg>
        <div id="speed" class="mt-2 text-white font-mono text-sm tracking-widest font-normal slight-outline">
            100.0 u/s
        </div>
    </div>

    <!-- Translucent Escape Menu Overlay -->
    <div id="esc-menu" class="hidden absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center">
        <div class="bg-neutral-900/80 border border-neutral-700/60 p-8 rounded-2xl shadow-2xl w-96 text-white font-mono backdrop-blur-xl">
            
            <div class="mb-6">
                <label for="sens-slider" class="block text-sm mb-2 text-neutral-300 flex justify-between">
                    <span>Mouse Sensitivity</span>
                    <span id="sens-value" class="rainbow-target text-yellow-400 font-bold">20</span>
                </label>
                <input id="sens-slider" type="range" min="20" max="80" step="1" value="20" 
                    class="w-full h-2 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-yellow-400">
                <div class="flex justify-between text-xs text-neutral-500 mt-1">
                    <span>Low (20)</span>
                    <span>High (80)</span>
                </div>
            </div>

            <!-- Shoulder View Slider (3 Steps: Left, Center, Right) -->
            <div class="mb-6">
                <label for="shoulder-slider" class="block text-sm mb-2 text-neutral-300 flex justify-between">
                    <span>Camera Perspective</span>
                    <span id="shoulder-value" class="rainbow-target text-yellow-400 font-bold">Right Shoulder</span>
                </label>
                <input id="shoulder-slider" type="range" min="0" max="2" step="1" value="2" 
                    class="w-full h-2 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-yellow-400">
                <div class="flex justify-between text-xs text-neutral-500 mt-1">
                    <span>Left</span>
                    <span>Center</span>
                    <span>Right</span>
                </div>
            </div>

            <!-- Third-Person View Toggle (Also toggled via V key) -->
            <div class="mb-6 flex items-center justify-between bg-neutral-800/50 p-3 rounded-lg border border-neutral-700/50">
                <span class="text-sm text-neutral-300">Third-Person View (V)</span>
                <input id="thirdperson-toggle" type="checkbox" checked class="rainbow-accent w-4 h-4 accent-yellow-400 cursor-pointer">
            </div>

            <!-- Camera Sway Toggle -->
            <div class="mb-6 flex items-center justify-between bg-neutral-800/50 p-3 rounded-lg border border-neutral-700/50">
                <span class="text-sm text-neutral-300">Smooth Camera Sway</span>
                <input id="sway-toggle" type="checkbox" class="rainbow-accent w-4 h-4 accent-yellow-400 cursor-pointer">
            </div>

            <!-- Rainbow Mode Toggle -->
            <div class="mb-6 flex items-center justify-between bg-neutral-800/50 p-3 rounded-lg border border-neutral-700/50">
                <span class="text-sm text-neutral-300">Rainbow Mode</span>
                <input id="rainbow-toggle" type="checkbox" class="rainbow-accent w-4 h-4 accent-yellow-400 cursor-pointer">
            </div>

            <!-- Unstuck Button in Pause Menu -->
            <button id="unstuck-btn" class="w-full py-3 mb-4 bg-neutral-800 hover:bg-neutral-700 text-yellow-400 font-bold rounded-xl transition duration-200 tracking-wider border border-yellow-500/30 shadow-lg">
                UNSTUCK
            </button>

            <button id="resume-btn" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl transition duration-200 tracking-wider shadow-lg">
                RESUME GAME
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        const colliders = []; 
        let useRainbowMode = false;
        let useCameraSway = false;
        let rainbowHue = 0;

        const keys = { w: false, a: false, s: false, d: false, space: false };
        const keyHistory = [];
        let isPointerLocked = false;
        let isMenuOpen = false;
        let mouseSensitivity = 0.0020;
        
        let isThirdPerson = true;
        let shoulderMode = 2; // 0 = Left, 1 = Center, 2 = Right
        let playerMesh = null;
        let playerBodyMat = null;
        let smoothedCamPos = new THREE.Vector3();

        const PHYSICS = {
            baseGravity: 24.0,
            friction: 6.0,
            airBrakeDrag: 3.5, 
            startVelocity: 100.0,
            maxVelocity: 5000.0,
            baseJumpForce: 9.2
        };

        const player = {
            position: new THREE.Vector3(0, 45, 0), 
            velocity: new THREE.Vector3(0, 0, 0),
            radius: 0.6,
            height: 1.8,
            onGround: false,
            wasOnGround: false,
            yaw: 0,
            pitch: 0
        };

        const raycaster = new THREE.Raycaster();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.05, 10000);

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                powerPreference: "high-performance",
                precision: "highp",
                alpha: false,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            sunLight.position.set(400, 800, 400);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 4000;
            const d = 800;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            const sunGeo = new THREE.SphereGeometry(35, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(800, 1500, 800);
            sunMesh.frustumCulled = true;
            scene.add(sunMesh);

            buildPlayerMesh();
            buildMap();
            setupEventListeners();

            smoothedCamPos.copy(player.position).add(new THREE.Vector3(0, player.height * 0.5, 0));

            window.addEventListener('resize', onWindowResize);
            
            requestAnimationFrame(animateLoop);
        }

        function buildPlayerMesh() {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16);
            playerBodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, playerBodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            group.add(body);

            group.visible = isThirdPerson;
            scene.add(group);
            playerMesh = group;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 512, 512);

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#555555';
            for (let i = 64; i < 512; i += 64) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 512);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(512, i);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function buildMap() {
            const cageSize = 1400;
            const cageHeight = 150;
            const gridTex = createGridTexture();
            const unitsPerRepeat = 5;
            gridTex.repeat.set(cageSize / unitsPerRepeat, cageSize / unitsPerRepeat);

            const protoMat = new THREE.MeshStandardMaterial({ 
                map: gridTex, 
                roughness: 0.8,
                metalness: 0.1
            });

            // Floor
            const floorGeo = new THREE.PlaneGeometry(cageSize, cageSize);
            floorGeo.rotateX(-Math.PI / 2);
            const floorMesh = new THREE.Mesh(floorGeo, protoMat);
            floorMesh.receiveShadow = true;
            floorMesh.frustumCulled = true;
            scene.add(floorMesh);
            colliders.push(floorMesh);

            // Perimeter Walls
            const wallTexN = createGridTexture();
            wallTexN.repeat.set(cageSize / unitsPerRepeat, cageHeight / unitsPerRepeat);
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTexN, roughness: 0.8, metalness: 0.1 });

            const wallGeo1 = new THREE.BoxGeometry(cageSize, cageHeight, 6);
            const wallN = new THREE.Mesh(wallGeo1, wallMat);
            wallN.position.set(0, cageHeight / 2, -cageSize / 2);
            wallN.receiveShadow = true;
            wallN.frustumCulled = true;
            scene.add(wallN);
            colliders.push(wallN);

            const wallS = new THREE.Mesh(wallGeo1, wallMat);
            wallS.position.set(0, cageHeight / 2, cageSize / 2);
            wallS.receiveShadow = true;
            wallS.frustumCulled = true;
            scene.add(wallS);
            colliders.push(wallS);

            const wallGeo2 = new THREE.BoxGeometry(6, cageHeight, cageSize);
            const wallE = new THREE.Mesh(wallGeo2, wallMat);
            wallE.position.set(cageSize / 2, cageHeight / 2, 0);
            wallE.receiveShadow = true;
            wallE.frustumCulled = true;
            scene.add(wallE);
            colliders.push(wallE);

            const wallW = new THREE.Mesh(wallGeo2, wallMat);
            wallW.position.set(-cageSize / 2, cageHeight / 2, 0);
            wallW.receiveShadow = true;
            wallW.frustumCulled = true;
            scene.add(wallW);
            colliders.push(wallW);

            // Obstacles & Towers
            const obstacleConfigs = [
                { x: 0, y: 10, z: 0, w: 40, h: 20, d: 40 },
                { x: -100, y: 7, z: -100, w: 30, h: 14, d: 30 },
                { x: 100, y: 12, z: 100, w: 35, h: 24, d: 35 },
                { x: -100, y: 5, z: 100, w: 20, h: 10, d: 50 },
                { x: 100, y: 5, z: -100, w: 50, h: 10, d: 20 },
                { x: 0, y: 7.5, z: 120, w: 50, h: 15, d: 50 },
                { x: -120, y: 10, z: 0, w: 40, h: 20, d: 40 },
                { x: 120, y: 10, z: 0, w: 40, h: 20, d: 40 },
                { x: 300, y: 15, z: 300, w: 60, h: 30, d: 60 },
                { x: -300, y: 20, z: -300, w: 80, h: 40, d: 80 },
                { x: 300, y: 10, z: -300, w: 50, h: 20, d: 50 },
                { x: -300, y: 12, z: 300, w: 70, h: 25, d: 40 },
                { x: 0, y: 25, z: 400, w: 100, h: 50, d: 60 },
                { x: 0, y: 25, z: -400, w: 100, h: 50, d: 60 },
                { x: 400, y: 25, z: 0, w: 60, h: 50, d: 100 },
                { x: -400, y: 25, z: 0, w: 60, h: 50, d: 100 },
                { x: 500, y: 30, z: 500, w: 90, h: 60, d: 90 },
                { x: -500, y: 35, z: -500, w: 90, h: 70, d: 90 },
                { x: 500, y: 20, z: -500, w: 80, h: 40, d: 80 },
                { x: -500, y: 20, z: 500, w: 80, h: 40, d: 80 },
                { x: 200, y: 40, z: 200, w: 50, h: 80, d: 50 },
                { x: -200, y: 40, z: -200, w: 50, h: 80, d: 50 },
            ];

            obstacleConfigs.forEach(obs => {
                createGroundedObstacle(obs.x, obs.y, obs.z, obs.w, obs.h, obs.d);
            });

            // Suspension Bridges
            const bridgeConfigs = [
                { x: 0, y: 20, z: 260, w: 16, h: 3, d: 240, rotY: 0 },
                { x: 0, y: 20, z: -260, w: 16, h: 3, d: 240, rotY: 0 },
                { x: 260, y: 20, z: 0, w: 16, h: 3, d: 240, rotY: Math.PI / 2 },
                { x: -260, y: 20, z: 0, w: 16, h: 3, d: 240, rotY: Math.PI / 2 },
                { x: 300, y: 40, z: 0, w: 12, h: 3, d: 200, rotY: Math.PI / 2 },
            ];

            bridgeConfigs.forEach(bc => {
                createBridge(bc.x, bc.y, bc.z, bc.w, bc.h, bc.d, bc.rotY);
            });

            // Ramps
            const rampWidth = 36;
            const rampHeight = 20;
            const rampLength = 64;

            const rampTex = createGridTexture();
            rampTex.repeat.set(rampLength / unitsPerRepeat, rampWidth / unitsPerRepeat);
            const rampMat = new THREE.MeshStandardMaterial({ map: rampTex, roughness: 0.8, metalness: 0.1 });
            
            const shape3D = new THREE.Shape();
            shape3D.moveTo(0, 0);
            shape3D.lineTo(0, rampHeight);
            shape3D.lineTo(rampLength, 0);
            shape3D.closePath();

            const extrudeSettings = { steps: 1, depth: rampWidth, bevelEnabled: false };
            const rampGeo = new THREE.ExtrudeGeometry(shape3D, extrudeSettings);
            rampGeo.center();

            const rampConfigs = [
                { x: 70, z: -70, rotation: 0 },
                { x: -80, z: 80, rotation: Math.PI / 2 },
                { x: 90, z: 60, rotation: Math.PI },
                { x: -90, z: -60, rotation: -Math.PI / 2 },
                { x: 0, z: 120, rotation: Math.PI },
                { x: 0, z: -120, rotation: 0 },
                { x: -140, z: -140, rotation: Math.PI / 4 },
                { x: 140, z: 140, rotation: -3 * Math.PI / 4 },
                { x: 250, z: 250, rotation: Math.PI / 3 },
                { x: -250, z: -250, rotation: -Math.PI / 3 },
                { x: 250, z: -250, rotation: 2 * Math.PI / 3 },
                { x: -250, z: 250, rotation: -2 * Math.PI / 3 },
                { x: 400, z: 200, rotation: 0 },
                { x: -400, z: -200, rotation: Math.PI },
                { x: 200, z: 400, rotation: Math.PI / 2 },
                { x: -200, z: -400, rotation: -Math.PI / 2 },
                { x: 450, z: 450, rotation: Math.PI / 4 },
                { x: -450, z: -450, rotation: 3 * Math.PI / 4 }
            ];

            rampConfigs.forEach(cfg => {
                const rampMesh = new THREE.Mesh(rampGeo, rampMat);
                rampMesh.position.set(cfg.x, rampHeight / 2, cfg.z);
                rampMesh.rotation.y = cfg.rotation;
                rampMesh.castShadow = true;
                rampMesh.receiveShadow = true;
                rampMesh.frustumCulled = true;
                scene.add(rampMesh);
                
                colliders.push(rampMesh);
            });
        }

        function createGroundedObstacle(x, y, z, w, h, d) {
            const gridTex = createGridTexture();
            gridTex.repeat.set(w / 5, h / 5);
            const mat = new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.8 });
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.frustumCulled = true;
            scene.add(mesh);
            colliders.push(mesh);
        }

        function createBridge(x, y, z, w, h, d, rotY) {
            const gridTex = createGridTexture();
            gridTex.repeat.set(w / 5, d / 5);
            const mat = new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.7 });
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.frustumCulled = true;
            scene.add(mesh);
            colliders.push(mesh);
        }

        function setupEventListeners() {
            renderer.domElement.addEventListener('click', () => {
                if (!isMenuOpen) {
                    renderer.domElement.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
                if (!isPointerLocked && !isMenuOpen) {
                    openEscMenu();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked || isMenuOpen) return;
                player.yaw -= e.movementX * mouseSensitivity;
                player.pitch -= e.movementY * mouseSensitivity;

                const maxPitch = Math.PI / 2 - 0.01;
                player.pitch = Math.max(-maxPitch, Math.min(maxPitch, player.pitch));
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Escape') {
                    if (!isMenuOpen) {
                        openEscMenu();
                    }
                    return;
                }

                if (isMenuOpen) return;

                if (e.code === 'KeyV') {
                    isThirdPerson = !isThirdPerson;
                    const tpToggle = document.getElementById('thirdperson-toggle');
                    if (tpToggle) tpToggle.checked = isThirdPerson;
                    if (playerMesh) playerMesh.visible = isThirdPerson;
                }

                handleKey(e, true);
            });

            window.addEventListener('keyup', (e) => {
                if (isMenuOpen) return;
                handleKey(e, false);
            });

            const sensSlider = document.getElementById('sens-slider');
            const sensValue = document.getElementById('sens-value');
            sensSlider.addEventListener('input', (e) => {
                const sliderVal = parseInt(e.target.value, 10);
                sensValue.innerText = sliderVal;
                mouseSensitivity = sliderVal * 0.0001;
            });

            const shoulderSlider = document.getElementById('shoulder-slider');
            const shoulderValue = document.getElementById('shoulder-value');
            shoulderSlider.addEventListener('input', (e) => {
                shoulderMode = parseInt(e.target.value, 10);
                if (shoulderMode === 0) shoulderValue.innerText = "Left Shoulder";
                else if (shoulderMode === 1) shoulderValue.innerText = "Center";
                else shoulderValue.innerText = "Right Shoulder";
            });

            const thirdPersonToggle = document.getElementById('thirdperson-toggle');
            thirdPersonToggle.addEventListener('change', (e) => {
                isThirdPerson = e.target.checked;
                if (playerMesh) {
                    playerMesh.visible = isThirdPerson;
                }
            });

            const swayToggle = document.getElementById('sway-toggle');
            swayToggle.addEventListener('change', (e) => {
                useCameraSway = e.target.checked;
            });

            const rainbowToggle = document.getElementById('rainbow-toggle');
            rainbowToggle.addEventListener('change', (e) => {
                useRainbowMode = e.target.checked;
                const pathEl = document.getElementById('crosshair-path');
                const speedEl = document.getElementById('speed');
                const unstuckBtn = document.getElementById('unstuck-btn');
                const resumeBtn = document.getElementById('resume-btn');
                const sensSliderEl = document.getElementById('sens-slider');
                const shoulderSliderEl = document.getElementById('shoulder-slider');
                const rainbowTargets = document.querySelectorAll('.rainbow-target');
                const rainbowAccents = document.querySelectorAll('.rainbow-accent');

                if (!useRainbowMode) {
                    pathEl.setAttribute('stroke', 'white');
                    speedEl.style.color = 'white';
                    unstuckBtn.style.color = '#fbbf24';
                    unstuckBtn.style.borderColor = 'rgba(251, 191, 36, 0.3)';
                    resumeBtn.style.backgroundColor = '#eab308';
                    resumeBtn.style.color = 'black';
                    sensSliderEl.style.accentColor = '#eab308';
                    shoulderSliderEl.style.accentColor = '#eab308';
                    rainbowTargets.forEach(el => el.style.color = '#fbbf24');
                    rainbowAccents.forEach(el => el.style.accentColor = '#eab308');
                    if (playerBodyMat) playerBodyMat.color.setHex(0x3b82f6);
                }
            });

            document.getElementById('resume-btn').addEventListener('click', () => {
                closeEscMenu();
            });

            document.getElementById('unstuck-btn').addEventListener('click', () => {
                triggerUnstuck();
            });
        }

        function openEscMenu() {
            isMenuOpen = true;
            document.getElementById('esc-menu').classList.remove('hidden');
            if (document.pointerLockElement) {
                document.exitPointerLock();
            }
        }

        function closeEscMenu() {
            isMenuOpen = false;
            document.getElementById('esc-menu').classList.add('hidden');
            renderer.domElement.requestPointerLock();
        }

        function triggerUnstuck() {
            player.position.set(0, 45, 0);
            player.velocity.set(0, 0, 0);
            smoothedCamPos.copy(player.position).add(new THREE.Vector3(0, player.height * 0.5, 0));
            closeEscMenu();
        }

        function handleKey(e, isDown) {
            let code = null;
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': code = 'w'; break;
                case 'KeyS': case 'ArrowDown': code = 's'; break;
                case 'KeyA': case 'ArrowLeft': code = 'a'; break;
                case 'KeyD': case 'ArrowRight': code = 'd'; break;
                case 'Space': keys.space = isDown; break;
            }

            if (code) {
                if (isDown) {
                    if (!keys[code]) {
                        keys[code] = true;
                        keyHistory.push(code);
                    }
                } else {
                    keys[code] = false;
                    const index = keyHistory.indexOf(code);
                    if (index > -1) keyHistory.splice(index, 1);
                }
            }
        }

        function updatePhysics(dt) {
            if (isMenuOpen) return;

            const subSteps = 4;
            const subDt = dt / subSteps;

            for (let step = 0; step < subSteps; step++) {
                const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
                const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

                let moveDir = new THREE.Vector3(0, 0, 0);

                let activeW = keys.w;
                let activeS = keys.s;
                let activeA = keys.a;
                let activeD = keys.d;

                if (keys.w && keys.s) {
                    if (keyHistory.lastIndexOf('w') > keyHistory.lastIndexOf('s')) activeS = false;
                    else activeW = false;
                }
                if (keys.a && keys.d) {
                    if (keyHistory.lastIndexOf('a') > keyHistory.lastIndexOf('d')) activeD = false;
                    else activeA = false;
                }

                if (activeW) moveDir.add(forward);
                if (activeS) moveDir.sub(forward);
                if (activeA) moveDir.add(right);
                if (activeD) moveDir.sub(right);
                
                if (moveDir.lengthSq() > 0) {
                    moveDir.normalize();
                }

                const horizVec = new THREE.Vector2(player.velocity.x, player.velocity.z);
                let currentSpeed = horizVec.length();

                if (currentSpeed < 1.0 && moveDir.lengthSq() > 0) {
                    currentSpeed = PHYSICS.startVelocity;
                } else {
                    currentSpeed = Math.max(currentSpeed, PHYSICS.startVelocity);
                }

                if (moveDir.lengthSq() > 0) {
                    const targetVelX = moveDir.x * Math.max(currentSpeed, PHYSICS.startVelocity);
                    const targetVelZ = moveDir.z * Math.max(currentSpeed, PHYSICS.startVelocity);
                    player.velocity.x += (targetVelX - player.velocity.x) * 14.0 * subDt;
                    player.velocity.z += (targetVelZ - player.velocity.z) * 14.0 * subDt;
                } else if (player.onGround) {
                    player.velocity.x *= Math.max(0, 1 - PHYSICS.friction * subDt);
                    player.velocity.z *= Math.max(0, 1 - PHYSICS.friction * subDt);
                }

                if (!player.onGround && keys.s) {
                    player.velocity.x *= Math.max(0, 1 - PHYSICS.airBrakeDrag * subDt);
                    player.velocity.z *= Math.max(0, 1 - PHYSICS.airBrakeDrag * subDt);
                }

                let newHoriz = new THREE.Vector2(player.velocity.x, player.velocity.z);
                if (newHoriz.length() > PHYSICS.maxVelocity) {
                    newHoriz.normalize().multiplyScalar(PHYSICS.maxVelocity);
                    player.velocity.x = newHoriz.x;
                    player.velocity.z = newHoriz.y;
                }

                let heightAboveGround = Math.max(0, player.position.y - 45);
                let exponentialGravityMultiplier = 1.0 + Math.pow(heightAboveGround / 70.0, 1.4);
                let currentGravity = PHYSICS.baseGravity * exponentialGravityMultiplier;

                player.velocity.y -= currentGravity * subDt;

                const nextX = player.position.x + player.velocity.x * subDt;
                const nextZ = player.position.z + player.velocity.z * subDt;

                const testPos = new THREE.Vector3(nextX, player.position.y + 0.5, nextZ);
                const radialDirs = [
                    new THREE.Vector3(1, 0, 0),
                    new THREE.Vector3(-1, 0, 0),
                    new THREE.Vector3(0, 0, 1),
                    new THREE.Vector3(0, 0, -1),
                    new THREE.Vector3(0.707, 0, 0.707),
                    new THREE.Vector3(-0.707, 0, 0.707),
                    new THREE.Vector3(0.707, 0, -0.707),
                    new THREE.Vector3(-0.707, 0, -0.707)
                ];

                let horizontalBlocked = false;
                for (let dir of radialDirs) {
                    raycaster.set(testPos, dir);
                    const hits = raycaster.intersectObjects(colliders, true);
                    if (hits.length > 0 && hits[0].distance < player.radius + 0.1) {
                        horizontalBlocked = true;
                        break;
                    }
                }

                if (!horizontalBlocked) {
                    player.position.x = nextX;
                    player.position.z = nextZ;
                } else {
                    const testPosX = new THREE.Vector3(nextX, player.position.y + 0.5, player.position.z);
                    let blockedX = false;
                    for (let dir of radialDirs) {
                        raycaster.set(testPosX, dir);
                        const hits = raycaster.intersectObjects(colliders, true);
                        if (hits.length > 0 && hits[0].distance < player.radius + 0.1) { blockedX = true; break; }
                    }
                    if (!blockedX) { player.position.x = nextX; player.velocity.z = 0; }
                    else { player.velocity.x = 0; }

                    const testPosZ = new THREE.Vector3(player.position.x, player.position.y + 0.5, nextZ);
                    let blockedZ = false;
                    for (let dir of radialDirs) {
                        raycaster.set(testPosZ, dir);
                        const hits = raycaster.intersectObjects(colliders, true);
                        if (hits.length > 0 && hits[0].distance < player.radius + 0.1) { blockedZ = true; break; }
                    }
                    if (!blockedZ) { player.position.z = nextZ; player.velocity.x = 0; }
                    else { player.velocity.z = 0; }
                }

                player.position.y += player.velocity.y * subDt;

                const limit = 4500;
                if (player.position.x > limit) { player.position.x = limit; player.velocity.x = 0; }
                if (player.position.x < -limit) { player.position.x = -limit; player.velocity.x = 0; }
                if (player.position.z > limit) { player.position.z = limit; player.velocity.z = 0; }
                if (player.position.z < -limit) { player.position.z = -limit; player.velocity.z = 0; }

                raycaster.set(new THREE.Vector3(player.position.x, player.position.y + 0.5, player.position.z), new THREE.Vector3(0, -1, 0));
                const intersects = raycaster.intersectObjects(colliders, true);

                let groundY = 0;
                let hitFound = false;

                for (let i = 0; i < intersects.length; i++) {
                    const hit = intersects[i];
                    if (hit.distance <= player.radius + 0.8 && hit.point.y <= player.position.y + 0.5) {
                        groundY = hit.point.y;
                        hitFound = true;
                        break;
                    }
                }

                if (hitFound && player.position.y <= groundY + player.radius) {
                    player.position.y = groundY + player.radius;
                    player.velocity.y = 0;
                    player.onGround = true;
                    player.wasOnGround = true;

                    if (keys.space) {
                        let currentHorizontalSpeed = new THREE.Vector2(player.velocity.x, player.velocity.z).length() * 10;
                        currentHorizontalSpeed = Math.min(currentHorizontalSpeed, PHYSICS.maxVelocity);
                        const speedRatio = Math.min(currentHorizontalSpeed / 200.0, 20.0);
                        player.velocity.y = PHYSICS.baseJumpForce * (1.0 + speedRatio * 0.22);
                        player.onGround = false;
                        player.wasOnGround = false;
                    }
                } else {
                    if (player.wasOnGround && keys.space && player.velocity.y <= 0) {
                        let horizSpeed = new THREE.Vector2(player.velocity.x, player.velocity.z).length() * 10;
                        horizSpeed = Math.min(horizSpeed, PHYSICS.maxVelocity);
                        if (horizSpeed > 100.0) {
                            const trimpBoost = (horizSpeed / 100.0) * 11.0;
                            player.velocity.y += trimpBoost;
                            player.wasOnGround = false;
                        }
                    }
                    player.onGround = false;
                }
            }

            if (playerMesh) {
                playerMesh.position.copy(player.position);
                playerMesh.rotation.y = player.yaw;
            }
        }

        let lastTime = performance.now();

        function animateLoop(now) {
            requestAnimationFrame(animateLoop);

            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.1) dt = 0.1;

            updatePhysics(dt);

            const targetCamPos = player.position.clone();
            targetCamPos.y += player.height * 0.5;

            const lookDir = new THREE.Vector3(
                Math.sin(player.yaw) * Math.cos(player.pitch),
                Math.sin(player.pitch),
                Math.cos(player.yaw) * Math.cos(player.pitch)
            );
            const rightDir = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            let finalCamPos;

            if (isThirdPerson) {
                let xOffset = 0.9;
                if (shoulderMode === 0) xOffset = -0.9;
                else if (shoulderMode === 1) xOffset = 0.0;

                const backDist = 3.2;
                const upDist = 1.2;

                const shoulderOffset = lookDir.clone().negate().multiplyScalar(backDist)
                    .add(rightDir.multiplyScalar(xOffset))
                    .add(new THREE.Vector3(0, upDist, 0));

                const idealCamPos = targetCamPos.clone().add(shoulderOffset);

                raycaster.set(targetCamPos, idealCamPos.clone().sub(targetCamPos).normalize());
                const distanceToIdeal = targetCamPos.distanceTo(idealCamPos);
                const hits = raycaster.intersectObjects(colliders, true);

                finalCamPos = idealCamPos;
                if (hits.length > 0 && hits[0].distance < distanceToIdeal) {
                    finalCamPos = targetCamPos.clone().add(
                        idealCamPos.clone().sub(targetCamPos).normalize().multiplyScalar(Math.max(0.4, hits[0].distance - 0.3))
                    );
                }
            } else {
                finalCamPos = targetCamPos.clone().add(new THREE.Vector3(0, player.height * 0.25, 0));
            }

            if (useCameraSway) {
                smoothedCamPos.lerp(finalCamPos, 0.25);
            } else {
                smoothedCamPos.copy(finalCamPos);
            }

            camera.position.copy(smoothedCamPos);
            camera.lookAt(camera.position.clone().add(lookDir));

            renderer.render(scene, camera);

            if (useRainbowMode) {
                rainbowHue = (rainbowHue + dt * 120) % 360;
                const hexColor = `hsl(${rainbowHue}, 100%, 50%)`;
                
                const pathEl = document.getElementById('crosshair-path');
                pathEl.setAttribute('stroke', hexColor);

                const speedEl = document.getElementById('speed');
                speedEl.style.color = hexColor;

                const unstuckBtn = document.getElementById('unstuck-btn');
                unstuckBtn.style.color = hexColor;
                unstuckBtn.style.borderColor = hexColor;

                const resumeBtn = document.getElementById('resume-btn');
                resumeBtn.style.backgroundColor = hexColor;
                resumeBtn.style.color = 'black';

                const sensSliderEl = document.getElementById('sens-slider');
                sensSliderEl.style.accentColor = hexColor;

                const shoulderSliderEl = document.getElementById('shoulder-slider');
                shoulderSliderEl.style.accentColor = hexColor;

                const rainbowTargets = document.querySelectorAll('.rainbow-target');
                rainbowTargets.forEach(el => el.style.color = hexColor);

                const rainbowAccents = document.querySelectorAll('.rainbow-accent');
                rainbowAccents.forEach(el => el.style.accentColor = hexColor);

                if (playerBodyMat) {
                    playerBodyMat.color.set(hexColor);
                }
            }

            let horizontalSpeed = Math.sqrt(player.velocity.x ** 2 + player.velocity.z ** 2) * 10;
            horizontalSpeed = Math.min(horizontalSpeed, PHYSICS.maxVelocity);
            document.getElementById('speed').innerText = horizontalSpeed.toFixed(1) + ' u/s';
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
